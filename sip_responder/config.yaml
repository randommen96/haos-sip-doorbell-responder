name: "SIP Doorbell Responder"
description: "Answers Hikvision KB8113 doorbell rings with a Piper TTS message"
version: "1.0.22"
slug: "sip_responder"
init: false
homeassistant_api: true
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386

ports:
  5060/udp: 5060
  4000/udp: 4000
  4001/udp: 4001

host_network: false

options:
  sip_username: "doorbell"
  sip_password: "change_me"
  sip_display_name: "Doorbell Responder"
  sip_domain: "192.168.1.100"
  sip_port: 5060
  rtp_port_start: 4000
  tts_message: "Please use the other bell."
  tts_wav_path: "/media/tts/doorbell_message.wav"
  tts_audio_duration: 5
  tts_engine: "tts.piper"
  tts_voice: ""
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""

schema:
  sip_username: str
  sip_password: password
  sip_display_name: str
  sip_domain: str
  sip_port: int
  rtp_port_start: int
  tts_message: str
  tts_wav_path: str
  tts_audio_duration: int
  tts_engine: str
  tts_voice: str
  mqtt_host: str
  mqtt_port: int
  mqtt_username: str
  mqtt_password: password

map:
  - media:rw
  - tmp:rw
