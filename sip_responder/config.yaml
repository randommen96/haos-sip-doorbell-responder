name: "SIP Doorbell Responder"
description: "Answers Hikvision KB8113 doorbell rings with a Piper TTS message"
version: "1.0.100"
slug: "sip_responder"
url: "https://github.com/randommen96/haos-sip-doorbell-responder"
documentation: "https://github.com/randommen96/haos-sip-doorbell-responder/blob/main/README.md"
init: false
homeassistant_api: true
services:
  - "mqtt:want"
arch:
  - aarch64
  - amd64

# host_network: true — the add-on binds host ports directly, so Docker
# port mappings are ignored. Ports in use: 5060/udp (SIP) and
# 4000-4003/udp (two RTP/RTCP pairs: account + active call).
host_network: true

options:
  sip_username: "responder"
  sip_domain: "192.168.1.100"
  sip_port: 5060
  rtp_port_start: 4000
  tts_message: "Please use the other bell."
  tts_wav_path: "/media/tts/doorbell_message.wav"
  tts_engine: "tts.piper"
  tts_voice: ""
  mqtt_host: ""
  mqtt_port: 1883
  sensor_name: "Doorbell Pressed"
  log_level: 1
  mqtt_username: ""
  mqtt_password: ""
  mqtt_listen_topic: "doorbell/announce"
  doorbell_ip: ""
  tts_retry_enabled: true
  tts_retry_max_attempts: 0
  tts_retry_initial_delay: 5
  tts_retry_max_delay: 300
  doorbell_admin_username: "admin"
  doorbell_admin_password: ""

schema:
  sip_username: str
  sip_domain: str
  sip_port: int
  rtp_port_start: int
  tts_message: str
  tts_wav_path: str
  tts_engine: str
  tts_voice: str
  mqtt_host: str
  mqtt_port: int
  sensor_name: str
  log_level: int
  mqtt_username: str
  mqtt_password: password
  mqtt_listen_topic: str
  doorbell_ip: str
  tts_retry_enabled: bool
  tts_retry_max_attempts: int
  tts_retry_initial_delay: int
  tts_retry_max_delay: int
  doorbell_admin_username: str
  doorbell_admin_password: password

map:
  - media:rw
